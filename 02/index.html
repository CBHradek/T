<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=https://www.youtube.com/watch?v=dQw4w9WgXcQ">
    <title>Redirecting...</title>
    <style>
        body {
            background-color: #000000; /* Pitch black background */
            color: #ffffff;           /* Crisp white text */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .message-box {
            padding: 20px;
        }
        h1 {
            font-size: 2.5rem;       /* Makes the heading nice and big */
            margin-bottom: 20px;
            font-weight: 700;
        }
        p {
            font-size: 1.25rem;      /* Bigger body text */
            color: #aaaaaa;          /* Subtle gray for secondary text */
        }
        a {
            color: #38bdf8;          /* Clean light blue link color */
            text-decoration: underline;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="message-box">
    <h1>Redirecting you to YouTube...</h1>
    <p>If the video doesn't open automatically in a second, <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">click here</a>.</p>
</div>

</body>
</html>
